name: Security Regression Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  security-regression:
    name: Detect Security Regressions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: checker/package.json

      - name: Install checker dependencies
        run: npm ci --prefix checker

      - name: Build checker
        run: npm run build --prefix checker

      - name: Run security regression checker
        id: checker
        run: |
          node checker/dist/index.js \
            --manifest security-surface.yaml \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --format github-comment \
            --output-file /tmp/security-findings.md
        continue-on-error: true

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findingsPath = '/tmp/security-findings.md';

            if (!fs.existsSync(findingsPath)) {
              console.log('No findings file — skipping comment');
              return;
            }

            const body = fs.readFileSync(findingsPath, 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) =>
                c.user.login === 'github-actions[bot]' &&
                c.body.includes('## Security Regression Check')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
