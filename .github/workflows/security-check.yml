name: Security Regression Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  security-regression:
    name: Detect Security Regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Uses the action defined in this repo (action.yml), so every PR tests it too
      - name: Run security regression check
        uses: ./
        with:
          manifest: security-surface.yaml
